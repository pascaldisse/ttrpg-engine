<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-TTRPG Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .narration-log::-webkit-scrollbar { width: 6px; }
    .narration-log::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-4 grid grid-cols-12 gap-4 h-screen" style="max-height:100vh;">

    <!-- Scene image area (placeholder) -->
    <div id="scene-area" class="col-span-8 bg-gray-900 rounded-lg border border-gray-700 flex items-center justify-center min-h-[200px]">
      <span class="text-gray-600 text-sm">[ scene image — P4 ]</span>
    </div>

    <!-- Inspector panel -->
    <div id="inspector" class="col-span-4 bg-gray-900 rounded-lg border border-gray-700 p-3 overflow-y-auto flex flex-col gap-2">
      <h3 class="text-xs uppercase tracking-wider text-gray-500 mb-1">Entities</h3>
      <div id="entity-list" class="flex flex-col gap-1 text-sm">
        <!-- Populated by kernel/view.js -->
      </div>
    </div>

    <!-- Narration log -->
    <div id="narration-log" class="col-span-8 bg-gray-900 rounded-lg border border-gray-700 p-3 h-48 overflow-y-auto narration-log">
      <div id="narration-entries" class="text-sm text-gray-300 space-y-1">
        <div class="text-gray-600 italic">— session begins —</div>
      </div>
    </div>

    <!-- Action input bar -->
    <div id="action-area" class="col-span-4 bg-gray-900 rounded-lg border border-gray-700 p-3 flex flex-col gap-2">
      <textarea id="action-input" rows="3" placeholder="What do you do?"
        class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-sm text-gray-100 resize-none focus:outline-none focus:border-blue-500"></textarea>
      <button id="action-send"
        class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2 px-4 rounded transition-colors self-end">
        Send
      </button>
    </div>

  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
