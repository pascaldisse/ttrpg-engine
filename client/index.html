<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-TTRPG Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .narration-log::-webkit-scrollbar { width: 6px; }
    .narration-log::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen overflow-hidden">
  <div class="max-w-7xl mx-auto p-3 h-full flex flex-col gap-3">

    <!-- Header: title · player name · connection · new game -->
    <header class="flex items-center gap-3 shrink-0">
      <span class="text-amber-300 font-bold tracking-wide">⟁ AI-TTRPG</span>
      <span id="conn-dot" class="w-2 h-2 rounded-full bg-gray-600" title="connecting…"></span>
      <button id="music-toggle" class="text-sm px-1.5 rounded hover:bg-gray-800 transition-colors" title="Music">🔇</button>
      <button id="settings-toggle" class="text-sm px-1.5 rounded hover:bg-gray-800 transition-colors" title="Addons & settings">⚙</button>
      <div class="flex-1"></div>
      <label class="text-xs text-gray-500">You are</label>
      <input id="player-name" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-sm w-36 focus:outline-none focus:border-blue-500" />
      <button id="new-game" class="text-xs px-3 py-1.5 rounded border border-red-900/60 text-red-400/90 hover:bg-red-950/40 transition-colors" title="Reset the world to the campaign start">
        New game
      </button>
    </header>

    <div class="flex-1 min-h-0 grid grid-cols-12 gap-3">

      <!-- LEFT: scene + story + input — the game itself -->
      <div class="col-span-8 flex flex-col gap-3 min-h-0">

        <!-- Scene (location art/prose, or the combat HUD during encounters) -->
        <div id="scene-area" class="shrink-0 max-h-[45%] bg-gray-900 rounded-lg border border-gray-700 overflow-y-auto"></div>

        <!-- The story — dominant, growable -->
        <div id="narration-log" class="flex-1 min-h-0 bg-gray-900 rounded-lg border border-gray-700 p-4 overflow-y-auto narration-log">
          <div id="transcript-entries" class="text-sm space-y-0">
            <div class="text-gray-600 italic">— session begins —</div>
          </div>
        </div>

        <!-- Action input -->
        <div id="action-area" class="shrink-0 flex gap-2">
          <textarea id="action-input" rows="2" placeholder="What do you do?"
            class="flex-1 bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-gray-100 resize-none focus:outline-none focus:border-blue-500"></textarea>
          <button id="action-send"
            class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-5 rounded-lg transition-colors">
            Send
          </button>
        </div>
      </div>

      <!-- RIGHT: party · here · quests (+ collapsed debug inspector) -->
      <div id="inspector" class="col-span-4 bg-gray-900 rounded-lg border border-gray-700 p-3 overflow-y-auto flex flex-col gap-2 min-h-0">
        <!-- #player-hud is inserted as the first child by kernel/view.js -->
        <details id="debug-entities" class="mt-auto pt-2 text-xs text-gray-600 border-t border-gray-800">
          <summary class="cursor-pointer hover:text-gray-400 select-none">Debug · all entities</summary>
          <div id="entity-list" class="flex flex-col gap-1 text-sm mt-1"></div>
        </details>
      </div>

    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
